<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stick Parkour</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #1b1430;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------------------
// Canvas & scaling. The world is 450 units tall; width depends on the screen.
// ---------------------------------------------------------------------------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const WORLD_H = 450;
let W = 800, VH = 450, scale = 1, dpr = 1, oy = 0;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  scale = Math.min(h / WORLD_H, w / 640);
  W = w / scale;
  VH = h / scale;
  oy = VH - WORLD_H; // extra sky on tall (portrait) screens
}
window.addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Storage (best score) - wrapped so private mode never breaks the game
// ---------------------------------------------------------------------------
const BEST_KEY = 'stickParkourBest';
function loadBest() { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} }

// ---------------------------------------------------------------------------
// Tiny synth sound effects
// ---------------------------------------------------------------------------
let actx = null, muted = false;
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const sfx = {
  jump:  () => beep(380, 0.12, 'square', 0.04, 260),
  dbl:   () => beep(560, 0.18, 'triangle', 0.06, 520),
  coin:  () => { beep(880, 0.07, 'square', 0.03); setTimeout(() => beep(1320, 0.1, 'square', 0.03), 60); },
  slide: () => beep(220, 0.18, 'sawtooth', 0.025, -120),
  land:  () => beep(110, 0.07, 'triangle', 0.05),
  mantle:() => beep(260, 0.08, 'triangle', 0.05, 120),
  die:   () => beep(320, 0.55, 'sawtooth', 0.06, -280),
};

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function hash(a, b) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

// ---------------------------------------------------------------------------
// Game constants & state
// ---------------------------------------------------------------------------
const GRAV = 2300, JUMP_V = 790, DJUMP_V = 700;
const STAND_H = 64, SLIDE_H = 28, PW = 20;
const MANTLE = 18; // how far below a ledge you can still pull yourself up

let state = 'menu'; // menu | play | pause | dead
let player, solids, bars, coins, particles;
let camX, dist, coinScore, speed, deadTimer, shake, genX, lastTop, newBest, flash;
let best = loadBest();
let time = 0;

function reset() {
  player = {
    x: 0, y: 330, vy: 0, vx: 0,
    ground: true, jumps: 0, slide: 0, coyote: 0, buffer: 0,
    flip: 0, flipping: false, fastFall: false,
    phase: 0, airTime: 0, dead: false, rot: 0, mantle: 0,
  };
  solids = []; bars = []; coins = []; particles = [];
  camX = -150; dist = 0; coinScore = 0; speed = 380;
  deadTimer = 0; shake = 0; newBest = false; flash = 0;
  solids.push({ x: -500, y: 330, w: 1600, h: 2000, type: 'bld', seed: 7 });
  genX = 1100; lastTop = 330;
}

function score() { return Math.floor(dist / 20) + coinScore; }

// ---------------------------------------------------------------------------
// Level generation: rooftops with gaps, crates, vents, hanging billboards
// ---------------------------------------------------------------------------
function addCoinArc(x0, x1, yBase, height, n) {
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1);
    coins.push({ x: lerp(x0, x1, t), y: yBase - Math.sin(t * Math.PI) * height, got: false, t: Math.random() * 6 });
  }
}

function generate() {
  while (genX < camX + W + 900) {
    // next rooftop height (smaller y = higher)
    let top = clamp(lastTop - rnd(-90, 70), 230, 370);
    const up = lastTop - top; // positive -> next roof is higher
    const maxGap = speed * 0.5 * (up > 0 ? 1 - up / 170 : 1);
    const minGap = Math.min(maxGap * 0.8, speed * 0.15 + 40);
    const gap = rnd(minGap, maxGap);
    const x = genX + gap;
    const w = rnd(480, 1050);
    solids.push({ x, y: top, w, h: 2000, type: 'bld', seed: (Math.random() * 1000) | 0 });

    if (Math.random() < 0.6) addCoinArc(genX - 20, x + 20, Math.min(lastTop, top) - 70, 70, 5);

    // obstacles on this roof
    let ox = x + Math.max(240, speed * 0.55);
    while (ox < x + w - 170) {
      const r = Math.random();
      if (r < 0.38) {               // crate: jump over (or onto)
        const h = rnd(28, 46), bw = rnd(30, 48);
        solids.push({ x: ox, y: top - h, w: bw, h, type: 'box' });
        if (Math.random() < 0.5) addCoinArc(ox - 50, ox + bw + 50, top - h - 30, 40, 3);
        ox += bw;
      } else if (r < 0.62) {        // tall vent: big jump, or land on it
        const h = rnd(72, 102), bw = rnd(44, 74);
        solids.push({ x: ox, y: top - h, w: bw, h, type: 'vent' });
        ox += bw;
      } else if (r < 0.88) {        // hanging billboard: slide under
        const bw = rnd(100, 170);
        bars.push({ x: ox, y: top - 220, w: bw, h: 220 - 42 });
        for (let i = 0; i < 3; i++) coins.push({ x: ox + bw * (i + 0.5) / 3, y: top - 16, got: false, t: Math.random() * 6 });
        ox += bw;
      } else {                       // open roof: coin trail
        for (let i = 0; i < 4; i++) coins.push({ x: ox + i * 34, y: top - 24, got: false, t: Math.random() * 6 });
        ox += 120;
      }
      ox += speed * rnd(0.9, 1.5);
    }
    genX = x + w;
    lastTop = top;
  }
}

// ---------------------------------------------------------------------------
// Particles
// ---------------------------------------------------------------------------
function burst(x, y, n, color, spd, life, grav = 900, size = 3) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, color, grav, size });
  }
}
function dust(x, y, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x: x + rnd(-8, 8), y, vx: rnd(-160, -40), vy: rnd(-120, -20), life: 0.45, max: 0.45,
      color: 'rgba(255,220,190,', grav: 200, size: rnd(2, 4) });
  }
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
function start() {
  reset();
  state = 'play';
}
function pressJump() {
  if (state === 'menu') { start(); return; }
  if (state === 'dead') { if (deadTimer > 0.6) start(); return; }
  if (state === 'pause') { state = 'play'; return; }
  player.buffer = 0.13;
}
function pressSlide() {
  if (state !== 'play') return;
  const p = player;
  if (p.ground) {
    if (p.slide <= 0) sfx.slide();
    p.slide = 0.6;
  } else {
    p.fastFall = true; // dive down, then slide on landing
    p.flipping = false;
  }
}
function togglePause() {
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
}

window.addEventListener('keydown', e => {
  const k = e.code;
  if (['Space', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyS'].includes(k)) e.preventDefault();
  if (e.repeat) return;
  if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW' || k === 'Enter') pressJump();
  else if (k === 'ArrowDown' || k === 'KeyS') pressSlide();
  else if (k === 'KeyP' || k === 'Escape') togglePause();
  else if (k === 'KeyM') muted = !muted;
});

// Touch / mouse: left part of the screen = slide, right part = jump.
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state === 'play' && e.clientX < window.innerWidth * 0.4) pressSlide();
  else pressJump();
});
cv.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') state = 'pause';
});

let isTouch = false;
window.addEventListener('touchstart', () => { isTouch = true; }, { passive: true });

// ---------------------------------------------------------------------------
// Physics
// ---------------------------------------------------------------------------
function pHeight(p) { return p.slide > 0 ? SLIDE_H : STAND_H; }

function hitsBar(p, h) {
  for (const b of bars) {
    if (p.x + PW / 2 > b.x && p.x - PW / 2 < b.x + b.w && p.y - h < b.y + b.h && p.y > b.y) return true;
  }
  return false;
}

function die() {
  const p = player;
  p.dead = true;
  p.vx = speed * 0.35;
  p.vy = -520;
  state = 'dead';
  deadTimer = 0;
  shake = 14;
  flash = 1;
  burst(p.x, p.y - 30, 26, 'rgba(255,255,255,', 420, 0.8);
  sfx.die();
  const s = score();
  if (s > best) { best = s; newBest = true; saveBest(best); }
}

function step(dt) {
  const p = player;
  speed = Math.min(880, 380 + dist * 0.008);
  p.buffer -= dt;
  p.coyote -= dt;
  if (p.mantle > 0) p.mantle -= dt;

  if (p.slide > 0) {
    p.slide -= dt;
    // keep sliding while there is a billboard above us
    if (p.slide <= 0 && hitsBar(p, STAND_H)) p.slide = 0.05;
  }

  // jumping (buffered, with coyote time and a double jump)
  if (p.buffer > 0) {
    if (p.ground || p.coyote > 0) {
      p.vy = -JUMP_V; p.ground = false; p.coyote = 0; p.jumps = 1; p.buffer = 0; p.slide = 0;
      dust(p.x, p.y, 6);
      sfx.jump();
    } else if (p.jumps < 2) {
      p.vy = -DJUMP_V; p.jumps = 2; p.buffer = 0;
      p.flipping = true; p.flip = 0; p.fastFall = false;
      burst(p.x, p.y - 10, 14, 'rgba(255,240,170,', 220, 0.4, 0);
      sfx.dbl();
    }
  }

  const prevBottom = p.y;
  p.vy += GRAV * dt;
  if (p.fastFall) p.vy = Math.max(p.vy, 1150);
  p.vy = Math.min(p.vy, 1700);

  const dx = speed * dt;
  p.x += dx;
  dist += dx;
  p.y += p.vy * dt;
  p.phase += dt * speed / 40;

  if (p.flipping) {
    p.flip += dt * 13;
    if (p.flip >= Math.PI * 2) { p.flip = 0; p.flipping = false; }
  }

  // landing: find the highest surface we crossed this step
  const wasGround = p.ground;
  p.ground = false;
  let landY = Infinity, landS = null;
  for (const s of solids) {
    if (p.x + PW / 2 > s.x && p.x - PW / 2 < s.x + s.w) {
      if (p.vy >= 0 && prevBottom <= s.y + 1 && p.y >= s.y && s.y < landY) { landY = s.y; landS = s; }
    }
  }
  if (landS) {
    p.y = landY;
    p.vy = 0;
    p.ground = true;
    if (!wasGround) {
      if (p.airTime > 0.25) { dust(p.x, p.y, 10); sfx.land(); }
      p.jumps = 0;
      p.flipping = false; p.flip = 0;
      if (p.fastFall) { p.fastFall = false; p.slide = 0.6; sfx.slide(); dust(p.x, p.y, 8); }
    }
  }
  if (p.ground) p.airTime = 0; else p.airTime += dt;
  if (wasGround && !p.ground && p.vy >= 0) p.coyote = 0.1;

  // side collisions: mantle up small ledges, otherwise crash
  const h = pHeight(p);
  for (const s of solids) {
    if (p.x + PW / 2 > s.x && p.x - PW / 2 < s.x + s.w && p.y > s.y + 2 && p.y - h < s.y + s.h) {
      if (p.y - s.y <= MANTLE && !hitsAbove(s)) {
        p.y = s.y; p.vy = 0; p.ground = true; p.jumps = 0; p.flipping = false; p.mantle = 0.18;
        sfx.mantle();
      } else { die(); return; }
    }
  }
  if (hitsBar(p, h)) { die(); return; }
  if (p.y > WORLD_H + 160) { die(); return; }

  // coins
  const cy = p.y - h / 2;
  for (const c of coins) {
    if (!c.got && Math.abs(c.x - p.x) < 24 && Math.abs(c.y - cy) < h / 2 + 14) {
      c.got = true;
      coinScore += 10;
      burst(c.x, c.y, 8, 'rgba(255,214,90,', 160, 0.35, 0, 2.5);
      sfx.coin();
    }
  }

  // running dust
  if (p.ground && Math.random() < (p.slide > 0 ? 0.7 : 0.12)) dust(p.x - 6, p.y, 1);
}

// a ledge can't be mantled if a solid sits right on top of it
function hitsAbove(s) {
  for (const o of solids) {
    if (o !== s && o.x < s.x + s.w && o.x + o.w > s.x && Math.abs(o.y + o.h - s.y) < 1 &&
        player.x + PW / 2 > o.x && player.x - PW / 2 < o.x + o.w) return true;
  }
  return false;
}

function update(dt) {
  time += dt;
  if (state === 'menu') {
    player.phase += dt * 380 / 40;
    return;
  }
  if (state === 'pause') return;

  if (state === 'play') {
    const sub = 3;
    for (let i = 0; i < sub && state === 'play'; i++) step(dt / sub);
    camX = player.x - Math.max(120, W * 0.28);
    generate();
    // cleanup things far behind the camera
    const cut = camX - 300;
    solids = solids.filter(s => s.x + s.w > cut);
    bars = bars.filter(b => b.x + b.w > cut);
    coins = coins.filter(c => c.x > cut && !(c.got));
  } else if (state === 'dead') {
    const p = player;
    deadTimer += dt;
    p.vy += GRAV * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += dt * 9;
  }

  for (const q of particles) {
    q.life -= dt;
    q.vy += q.grav * dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
  }
  particles = particles.filter(q => q.life > 0);
  shake = Math.max(0, shake - dt * 40);
  flash = Math.max(0, flash - dt * 3);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#2a1b4d');
  g.addColorStop(0.45, '#8f3b78');
  g.addColorStop(0.75, '#e86f5e');
  g.addColorStop(1, '#ffc27a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, VH);

  // sun
  const sx = W * 0.72, sy = oy + 250;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 160);
  sg.addColorStop(0, 'rgba(255,236,170,0.95)');
  sg.addColorStop(0.35, 'rgba(255,190,120,0.5)');
  sg.addColorStop(1, 'rgba(255,160,110,0)');
  ctx.fillStyle = sg;
  ctx.fillRect(sx - 160, sy - 160, 320, 320);
  ctx.fillStyle = '#ffe9a8';
  ctx.beginPath(); ctx.arc(sx, sy, 46, 0, Math.PI * 2); ctx.fill();

  // stars at the top
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let i = 0; i < 40; i++) {
    const x = (hash(i, 3) * W * 1.3 - (camX * 0.02) % (W * 1.3) + W * 1.3) % (W * 1.3);
    const y = hash(i, 9) * (oy + 120);
    const tw = 0.5 + 0.5 * Math.sin(time * 2 + i);
    ctx.globalAlpha = 0.3 + tw * 0.5;
    ctx.fillRect(x, y, 1.6, 1.6);
  }
  ctx.globalAlpha = 1;
}

function drawSkyline(f, unit, minH, maxH, color, seed, winColor) {
  const off = camX * f;
  const i0 = Math.floor(off / unit) - 1, i1 = i0 + Math.ceil(W / unit) + 3;
  ctx.fillStyle = color;
  for (let i = i0; i < i1; i++) {
    const h = lerp(minH, maxH, hash(i, seed));
    const bw = unit * lerp(0.7, 1.05, hash(i, seed + 1));
    const x = i * unit - off;
    const y = oy + WORLD_H - h;
    ctx.fillRect(x, y, bw, VH - y);
    if (hash(i, seed + 2) > 0.7) ctx.fillRect(x + bw * 0.4, y - 18, 3, 18); // antenna
  }
  if (winColor) {
    ctx.fillStyle = winColor;
    for (let i = i0; i < i1; i++) {
      const h = lerp(minH, maxH, hash(i, seed));
      const bw = unit * lerp(0.7, 1.05, hash(i, seed + 1));
      const x = i * unit - off, y = oy + WORLD_H - h;
      for (let r = 0; r < 8; r++) for (let c = 0; c < 3; c++) {
        if (hash(i * 13 + r, c + seed) > 0.78) ctx.fillRect(x + 6 + c * (bw - 12) / 3, y + 10 + r * 16, 4, 6);
      }
    }
  }
}

function drawBuilding(s) {
  const x = s.x - camX, y = s.y, bottom = VH - oy + 10;
  ctx.fillStyle = '#1a1230';
  ctx.fillRect(x, y, s.w, bottom - y);
  // roof ledge
  ctx.fillStyle = '#3b2c5e';
  ctx.fillRect(x - 4, y, s.w + 8, 7);
  ctx.fillStyle = '#5a4688';
  ctx.fillRect(x - 4, y, s.w + 8, 2);
  // side rim light
  ctx.fillStyle = 'rgba(255,170,120,0.18)';
  ctx.fillRect(x, y + 7, 3, bottom - y);
  // windows
  const x0 = Math.max(0, Math.floor((camX - s.x - 20) / 30));
  const x1 = Math.min(Math.floor((s.w - 30) / 30), Math.ceil((camX + W - s.x) / 30));
  for (let c = x0; c <= x1; c++) {
    for (let r = 0; ; r++) {
      const wy = y + 26 + r * 36;
      if (wy > bottom) break;
      const lit = hash(s.seed + c, r);
      ctx.fillStyle = lit > 0.72 ? 'rgba(255,207,107,0.85)' : lit > 0.45 ? 'rgba(120,100,170,0.35)' : 'rgba(40,30,70,0.9)';
      ctx.fillRect(x + 16 + c * 30, wy, 14, 20);
    }
  }
}

function drawBox(s) {
  const x = s.x - camX, y = s.y;
  ctx.fillStyle = '#9a5f2c';
  ctx.fillRect(x, y, s.w, s.h);
  ctx.strokeStyle = '#5e3714';
  ctx.lineWidth = 3;
  ctx.strokeRect(x + 1.5, y + 1.5, s.w - 3, s.h - 3);
  ctx.beginPath();
  ctx.moveTo(x + 3, y + 3); ctx.lineTo(x + s.w - 3, y + s.h - 3);
  ctx.moveTo(x + s.w - 3, y + 3); ctx.lineTo(x + 3, y + s.h - 3);
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,200,140,0.35)';
  ctx.fillRect(x, y, s.w, 2);
}

function drawVent(s) {
  const x = s.x - camX, y = s.y;
  ctx.fillStyle = '#4a4e6e';
  ctx.fillRect(x, y, s.w, s.h);
  ctx.fillStyle = '#353853';
  for (let yy = y + 10; yy < y + s.h - 6; yy += 9) ctx.fillRect(x + 6, yy, s.w - 12, 4);
  ctx.fillStyle = '#6c7199';
  ctx.fillRect(x - 3, y, s.w + 6, 5);
  ctx.fillStyle = 'rgba(255,200,150,0.4)';
  ctx.fillRect(x - 3, y, s.w + 6, 1.5);
}

function drawBar(b) {
  const x = b.x - camX, y = b.y, bottom = b.y + b.h;
  // chains going up out of view
  ctx.strokeStyle = '#2a2140';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x + 14, -oy - 10); ctx.lineTo(x + 14, y);
  ctx.moveTo(x + b.w - 14, -oy - 10); ctx.lineTo(x + b.w - 14, y);
  ctx.stroke();
  // board
  ctx.fillStyle = '#2b2045';
  ctx.fillRect(x, y, b.w, b.h);
  ctx.fillStyle = '#e94560';
  ctx.fillRect(x + 6, y + 6, b.w - 12, b.h - 30);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SLIDE', x + b.w / 2, y + b.h / 2 - 20);
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillText('↓', x + b.w / 2, y + b.h / 2 + 14);
  // hazard stripes on the bottom edge
  ctx.save();
  ctx.beginPath(); ctx.rect(x, bottom - 18, b.w, 18); ctx.clip();
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(x, bottom - 18, b.w, 18);
  ctx.fillStyle = '#111';
  for (let i = -20; i < b.w + 20; i += 20) {
    ctx.beginPath();
    ctx.moveTo(x + i, bottom); ctx.lineTo(x + i + 10, bottom); ctx.lineTo(x + i + 28, bottom - 18); ctx.lineTo(x + i + 18, bottom - 18);
    ctx.fill();
  }
  ctx.restore();
}

function drawCoin(c) {
  const x = c.x - camX, y = c.y + Math.sin(time * 4 + c.t) * 3;
  const sq = Math.abs(Math.cos(time * 3 + c.t));
  ctx.fillStyle = 'rgba(255,214,90,0.25)';
  ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd65a';
  ctx.beginPath(); ctx.ellipse(x, y, 7 * (0.35 + 0.65 * sq), 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff3c4';
  ctx.beginPath(); ctx.ellipse(x - 1.5 * sq, y - 2, 2 * sq + 0.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
}

// --- the stick man -------------------------------------------------------
// Angles are measured from "straight down", positive = forward (to the right).
function limbPts(x, y, a1, a2, l1, l2) {
  const kx = x + Math.sin(a1) * l1, ky = y + Math.cos(a1) * l1;
  const fx = kx + Math.sin(a1 + a2) * l2, fy = ky + Math.cos(a1 + a2) * l2;
  return [x, y, kx, ky, fx, fy];
}

function getPose(p) {
  if (p.dead) {
    const w = Math.sin(time * 18) * 0.5;
    return { hipY: -34, lean: 0.2, legs: [[0.9 + w, -0.5], [-0.6 - w, -0.4]], arms: [[2.2 + w, 0.4], [-2.0 - w, -0.3]] };
  }
  if (p.slide > 0 && p.ground) {
    return { hipY: -12, lean: -1.15, legs: [[1.45, 0.05], [0.9, -1.6]], arms: [[-0.9, 0.6], [2.0, 0.5]] };
  }
  if (p.mantle > 0) {
    return { hipY: -26, lean: 0.7, legs: [[1.3, -1.8], [0.2, -1.2]], arms: [[2.6, 0.3], [2.3, 0.4]] };
  }
  if (!p.ground && p.fastFall) {
    return { hipY: -36, lean: 0.05, legs: [[0.25, -0.3], [-0.15, -0.3]], arms: [[2.7, 0.2], [-2.7, -0.2]] };
  }
  if (!p.ground && p.flipping) {
    return { hipY: -34, lean: 0.4, legs: [[1.9, -2.5], [1.6, -2.4]], arms: [[1.4, 1.3], [1.1, 1.4]] };
  }
  if (!p.ground) {
    // blend between rising (tucked, arms up) and falling (legs reaching, arms out)
    const t = clamp((p.vy + 400) / 900, 0, 1);
    return {
      hipY: -36,
      lean: lerp(0.18, 0.08, t),
      legs: [[lerp(1.1, 0.55, t), lerp(-1.6, -0.35, t)], [lerp(-0.35, -0.15, t), lerp(-1.0, -0.7, t)]],
      arms: [[lerp(2.5, 1.9, t), lerp(0.3, 0.4, t)], [lerp(2.0, -1.3, t), lerp(0.5, -0.3, t)]],
    };
  }
  // running cycle
  const ph = p.phase;
  const leg = o => [Math.sin(ph + o) * 0.85, -(0.2 + 1.45 * Math.max(0, Math.cos(ph + o)))];
  const arm = o => [-Math.sin(ph + o) * 0.95, 1.25];
  return { hipY: -34 - 2.5 * Math.abs(Math.cos(ph)), lean: 0.3, legs: [leg(0), leg(Math.PI)], arms: [arm(0), arm(Math.PI)] };
}

function strokePts(pts) {
  ctx.beginPath();
  ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.stroke();
}

function drawStick(p) {
  const pose = getPose(p);
  const sx = p.x - camX, sy = p.y;
  ctx.save();
  ctx.translate(sx, sy);
  const hipY = pose.hipY;
  if (p.dead) { ctx.translate(0, hipY); ctx.rotate(p.rot); ctx.translate(0, -hipY); }
  else if (p.flipping) { ctx.translate(0, hipY); ctx.rotate(p.flip); ctx.translate(0, -hipY); }

  const hx = 0, hy = hipY;
  const shx = hx + Math.sin(pose.lean) * 26, shy = hy - Math.cos(pose.lean) * 26;
  const headX = shx + Math.sin(pose.lean) * 11, headY = shy - Math.cos(pose.lean) * 11;

  const legB = limbPts(hx, hy, pose.legs[1][0], pose.legs[1][1], 18, 18);
  const armB = limbPts(shx, shy, pose.arms[1][0], pose.arms[1][1], 15, 15);
  const legF = limbPts(hx, hy, pose.legs[0][0], pose.legs[0][1], 18, 18);
  const armF = limbPts(shx, shy, pose.arms[0][0], pose.arms[0][1], 15, 15);
  const torso = [hx, hy, shx, shy];

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // soft light outline so he reads against dark buildings too
  ctx.strokeStyle = 'rgba(255,230,200,0.35)';
  ctx.lineWidth = 9;
  [legB, armB, torso, legF, armF].forEach(strokePts);
  ctx.fillStyle = 'rgba(255,230,200,0.35)';
  ctx.beginPath(); ctx.arc(headX, headY, 10, 0, Math.PI * 2); ctx.fill();

  ctx.lineWidth = 5;
  ctx.strokeStyle = '#3a3a48';
  strokePts(legB); strokePts(armB);
  ctx.strokeStyle = '#0d0d12';
  strokePts(torso); strokePts(legF); strokePts(armF);
  ctx.fillStyle = '#0d0d12';
  ctx.beginPath(); ctx.arc(headX, headY, 7.5, 0, Math.PI * 2); ctx.fill();

  // headband tails flapping in the wind
  if (!p.dead) {
    const flap = Math.sin(time * 22) * 3;
    ctx.strokeStyle = '#e94560';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(headX - 6, headY - 2);
    ctx.quadraticCurveTo(headX - 14, headY - 4 + flap, headX - 22, headY + flap * 1.6);
    ctx.stroke();
  }
  ctx.restore();
}

function drawParticles() {
  for (const q of particles) {
    const a = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color + a.toFixed(3) + ')';
    ctx.fillRect(q.x - camX - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
}

function drawSpeedLines() {
  const k = clamp((speed - 520) / 360, 0, 1);
  if (k <= 0 || state !== 'play') return;
  ctx.strokeStyle = `rgba(255,255,255,${0.12 * k})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const y = hash(i, Math.floor(time * 8)) * WORLD_H;
    const x = ((hash(i, 5) * W - time * 1400 * (0.5 + hash(i, 6))) % W + W) % W;
    ctx.moveTo(x, y); ctx.lineTo(x + 60 + 80 * k, y);
  }
  ctx.stroke();
}

// --- HUD & overlays -------------------------------------------------------
function text(str, x, y, size, color = '#fff', align = 'center', weight = '800') {
  ctx.font = `${weight} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillText(str, x + 2, y + 3);
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function drawHUD() {
  text(String(score()), 20, 32, 32, '#fff', 'left');
  text('BEST ' + best, 22, 62, 14, 'rgba(255,255,255,0.75)', 'left', '700');
  text((speed / 380).toFixed(1) + 'x', W - 20, 32, 18, 'rgba(255,255,255,0.8)', 'right', '700');
  if (muted) text('MUTED', W - 20, 56, 12, 'rgba(255,255,255,0.6)', 'right', '700');
  if (isTouch && state === 'play' && dist < 3000) {
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.fillRect(0, 0, W * 0.4, VH);
    text('TAP: SLIDE', W * 0.2, VH - 30, 14, 'rgba(255,255,255,0.55)', 'center', '700');
    text('TAP: JUMP', W * 0.7, VH - 30, 14, 'rgba(255,255,255,0.55)', 'center', '700');
  }
}

function panel(h) {
  const pw = Math.min(460, W - 32), x = (W - pw) / 2, y = VH / 2 - h / 2;
  ctx.fillStyle = 'rgba(20,12,40,0.72)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, pw, h, 18); else ctx.rect(x, y, pw, h);
  ctx.fill();
  return y;
}

function drawMenu() {
  const y = panel(250);
  text('STICK PARKOUR', W / 2, y + 50, Math.min(44, W / 11), '#fff');
  text('Run the rooftops. Don’t look down.', W / 2, y + 88, 15, '#ffd6b0', 'center', '600');
  const ctl = isTouch
    ? ['Tap right side → jump (tap again in air: flip)', 'Tap left side → slide / dive']
    : ['SPACE / ↑ → jump  (again in air: double-jump flip)', '↓ / S → slide  (in air: dive)', 'P pause · M mute'];
  ctl.forEach((l, i) => text(l, W / 2, y + 126 + i * 22, 13, 'rgba(255,255,255,0.85)', 'center', '600'));
  const pulse = 0.6 + 0.4 * Math.sin(time * 4);
  text(isTouch ? 'TAP TO START' : 'PRESS SPACE TO START', W / 2, y + 220, 18, `rgba(255,210,63,${pulse})`);
  if (best) text('BEST ' + best, W / 2, y + 196 - (isTouch ? 0 : -2) - 0, 12, 'rgba(255,255,255,0.6)', 'center', '700');
}

function drawDead() {
  if (deadTimer < 0.5) return;
  const y = panel(210);
  text('WIPEOUT!', W / 2, y + 46, 40, '#ff6b6b');
  text(String(score()), W / 2, y + 100, 46, '#fff');
  text(newBest ? 'NEW BEST!' : 'BEST ' + best, W / 2, y + 140, 16, newBest ? '#ffd23f' : 'rgba(255,255,255,0.75)', 'center', '800');
  const pulse = 0.6 + 0.4 * Math.sin(time * 4);
  text(isTouch ? 'TAP TO RUN AGAIN' : 'SPACE TO RUN AGAIN', W / 2, y + 180, 16, `rgba(255,210,63,${pulse})`);
}

function render() {
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
  drawSky();
  drawSkyline(0.12, 70, 120, 230, '#6b2f63', 11, null);
  drawSkyline(0.3, 90, 70, 170, '#3d1f4d', 23, 'rgba(255,200,120,0.35)');

  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake) * 0.4, rnd(-shake, shake) * 0.4);
  ctx.translate(0, oy);

  for (const s of solids) {
    if (s.x - camX > W + 20 || s.x + s.w - camX < -20) continue;
    if (s.type === 'bld') drawBuilding(s);
  }
  for (const s of solids) {
    if (s.x - camX > W + 20 || s.x + s.w - camX < -20) continue;
    if (s.type === 'box') drawBox(s);
    else if (s.type === 'vent') drawVent(s);
  }
  for (const c of coins) if (!c.got && c.x - camX > -20 && c.x - camX < W + 20) drawCoin(c);
  drawStick(player);
  for (const b of bars) if (b.x - camX < W + 20 && b.x + b.w - camX > -20) drawBar(b);
  drawParticles();
  drawSpeedLines();
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.4})`; ctx.fillRect(0, 0, W, VH); }

  if (state === 'menu') drawMenu();
  else {
    drawHUD();
    if (state === 'pause') { panel(110); text('PAUSED', W / 2, VH / 2 - 14, 36); text(isTouch ? 'tap to resume' : 'P to resume', W / 2, VH / 2 + 26, 14, 'rgba(255,255,255,0.75)', 'center', '600'); }
    if (state === 'dead') drawDead();
  }
}

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
reset();
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
